<!DOCTYPE html>
<html lang="en">
<head>
    <title>Reliquary</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimal-ui">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="keywords" content="知识收录、知识存储、知识检索、个人资料库、语义检索、全文检索、文档管理、knowledge collection, knowledge storage, knowledge retrieval, personal library, semantic search, full-text search, document management"/>
    <meta name="description" content="Reliquary 用于个人知识的收录、存储与检索，内容由外部工具通过 HTTP 与 MCP 收录接口送入。Reliquary stores and retrieves personal knowledge supplied by external tools through HTTP and MCP ingest interfaces."/>
    <link rel="shortcut icon" type="image/png" href="/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="120x120" type="image/png" href="/favicon.ico"/>
</head>
<body>
<script>
(function(){
  var t=localStorage.getItem('Reliquary_theme')||'light';
  if(t==='system')t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  document.documentElement.setAttribute('theme-mode',t);
})();
</script>
<script src="/config.js"></script>
<div id="app"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
