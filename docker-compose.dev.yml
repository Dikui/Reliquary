# 开发环境配置 - 只启动基础设施服务，app 和 frontend 在本地运行
# Native app files use VAULT_ROOT, defaulting to .local-data/vault in scripts/dev.sh.
# This file mounts only PostgreSQL; production host data bindings are in docker-compose.yml.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - Reliquary-network-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 只启动依赖的基础设施服务
  postgres:
    image: paradedb/paradedb:v0.22.2-pg17@sha256:af585013f97f622715de01e48d00558f7edf17055d7b40deafc9f98ca8d99a56
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    networks:
      - Reliquary-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER}"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 1m


  # Small deployment on a 32 GB host: 1 GB heap + 1 GB page cache, 3 GB container limit.
  neo4j:
    image: neo4j:5.26.12-community@sha256:9f75e8df4325a24f00fdd7a8c0bcce650a58375049b1058e496e8b43d6c36b37
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1g
      - NEO4J_server_memory_pagecache_size=1g
    ports:
      - "127.0.0.1:${NEO4J_PORT:-7687}:7687"
    mem_limit: 3g
    volumes:
      - neo4j-data-dev:/data
    networks:
      - Reliquary-network-dev
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u \"neo4j\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

networks:
  Reliquary-network-dev:
    driver: bridge

volumes:
  postgres-data-dev:
  neo4j-data-dev:
