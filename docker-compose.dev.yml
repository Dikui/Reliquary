# 开发环境配置 - 只启动基础设施服务，app 和 frontend 在本地运行
# Native app files use VAULT_ROOT, defaulting to .local-data/vault in scripts/dev.sh.
services:
  # 只启动依赖的基础设施服务
  postgres:
    image: paradedb/paradedb:v0.22.2-pg17
    container_name: Reliquary-postgres-dev
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    networks:
      - Reliquary-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 1m


networks:
  Reliquary-network-dev:
    driver: bridge

volumes:
  postgres-data-dev:
