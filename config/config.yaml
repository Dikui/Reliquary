# Server configuration
server:
  port: 8080
  host: "0.0.0.0"

# Article processing prompts are resolved from prompt_templates/ YAML files.
article_processing:
  generate_summary_prompt_id: "default_summary"
  generate_questions_prompt_id: "default_generate_questions"
  summary:
    max_input_chars: 16384
    max_completion_tokens: 2048

# Knowledge base configuration
knowledge_base:
  chunk_size: 512
  chunk_overlap: 50
  split_markers: ["\n\n", "\n", "。"]
  document_process_timeout: 2h
  image_processing:
    enable_multimodal: true
