# Server configuration
server:
  port: 8080
  host: "0.0.0.0"

# Zero body limit derives a safe input budget from the generation model context.
article_processing:
  max_body_chars: 0
  max_images: 8
  # Zero chooses up to 4096 output tokens within the model context and output limits.
  max_completion_tokens: 0

# Server-local Markdown library. VAULT_ROOT is required.
vault:
  header_debounce: 5s
  stable_wait: 10m
  scan_interval: 1m

# Knowledge base configuration
knowledge_base:
  chunk_size: 512
  chunk_overlap: 50
  split_markers: ["\n\n", "\n", "。"]
  document_process_timeout: 2h
