      consumes:
        - application/json
      description: |-
        Partially update a wiki page by slug. Absent fields keep
        their stored value. When `version` is > 0 it acts as an
        optimistic-lock guard: a mismatch with the stored version
        returns 409 together with the current version so the client
        can reload and re-apply.
      parameters:
        - description: Knowledge base ID
          in: path
          name: kb_id
          required: true
          type: string
        - description: Page slug
          in: path
          name: slug
          required: true
          type: string
        - description: Fields to update
          in: body
          name: page
          required: true
          schema:
            $ref: '#/definitions/github_com_Tencent_Reliquary_internal_types.WikiPageUpdateRequest'
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
