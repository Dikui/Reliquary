        - description: Center slug for ego mode
          in: query
          name: center
          type: string
        - description: Ego BFS depth (1-3, default 1)
          in: query
          name: depth
          type: integer
        - description: Comma-separated page_type allow-list
          in: query
          name: types
          type: string
        - description: Max nodes to return (default 500, max 2000)
          in: query
          name: limit
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Tencent_Reliquary_internal_types.WikiGraphData'
      security:
