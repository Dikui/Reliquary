basePath: /api/v1
definitions:
  github_com_Tencent_Reliquary_internal_application_service.WikiLintIssue:
    properties:
      auto_fixable:
        type: boolean
      description:
        type: string
      page_slug:
        type: string
      severity:
        $ref: '#/definitions/github_com_Tencent_Reliquary_internal_application_service.WikiLintIssueSeverity'
      target_slug:
        description: |-
          TargetSlug identifies the other page involved in the issue (e.g. the
          broken link target, or the entity slug for a missing cross-ref). It is
          the structured field used by AutoFix instead of parsing Description.
        type: string
      type:
        $ref: '#/definitions/github_com_Tencent_Reliquary_internal_application_service.WikiLintIssueType'
    type: object
  github_com_Tencent_Reliquary_internal_application_service.WikiLintIssueSeverity:
    enum:
      - info
      - warning
      - error
    type: string
    x-enum-varnames:
      - SeverityInfo
      - SeverityWarning
      - SeverityError
  github_com_Tencent_Reliquary_internal_application_service.WikiLintIssueType:
    enum:
      - orphan_page
      - broken_link
      - stale_ref
      - missing_cross_ref
      - empty_content
      - duplicate_slug
    type: string
    x-enum-varnames:
      - LintIssueOrphanPage
      - LintIssueBrokenLink
      - LintIssueStaleRef
      - LintIssueMissingCrossRef
      - LintIssueEmptyContent
      - LintIssueDuplicateSlug
  github_com_Tencent_Reliquary_internal_application_service.WikiLintReport:
    properties:
      health_score:
        description: 0-100
        type: integer
      issues:
        items:
          $ref: '#/definitions/github_com_Tencent_Reliquary_internal_application_service.WikiLintIssue'
        type: array
      knowledge_base_id:
        type: string
      stats:
        $ref: '#/definitions/github_com_Tencent_Reliquary_internal_types.WikiStats'
      summary:
        type: string
    type: object
  github_com_Tencent_Reliquary_internal_datasource.ConnectorMetadata:
    properties:
      auth_type:
        description: '"oauth2", "api_key", "token", etc.'
        type: string
      capabilities:
        description: '"incremental", "webhook", "deletion_sync", etc.'
        items:
          type: string
        type: array
      description:
        type: string
      icon:
        type: string
      name:
        type: string
      priority:
        description: Priority order for UI display (lower = higher priority)
        type: integer
      type:
        type: string
    type: object
  github_com_Tencent_Reliquary_internal_errors.AppError:
    properties:
      code:
        $ref: '#/definitions/github_com_Tencent_Reliquary_internal_errors.ErrorCode'
      details: {}
      message:
        type: string
    type: object
  github_com_Tencent_Reliquary_internal_errors.ErrorCode:
    enum:
      - 1000
      - 1001
      - 1002
      - 1003
      - 1004
      - 1005
      - 1006
      - 1007
      - 1008
      - 1009
      - 1010
      - 2000
      - 2001
      - 2002
      - 2003
      - 2004
      - 2005
      - 2100
      - 2101
      - 2102
      - 2103
      - 2300
    type: integer
    x-enum-varnames:
      - ErrBadRequest
      - ErrUnauthorized
      - ErrForbidden
      - ErrNotFound
      - ErrMethodNotAllowed
      - ErrConflict
      - ErrTooManyRequests
      - ErrInternalServer
      - ErrServiceUnavailable
      - ErrTimeout
      - ErrValidation
      - ErrTenantNotFound
      - ErrTenantAlreadyExists
      - ErrTenantInactive
      - ErrTenantNameRequired
      - ErrTenantInvalidStatus
      - ErrTenantCreationDisabled
      - ErrAgentMissingThinkingModel
      - ErrAgentMissingAllowedTools
      - ErrAgentInvalidMaxIterations
      - ErrAgentInvalidTemperature
      - ErrModelInUse
  github_com_Tencent_Reliquary_internal_infrastructure_chunker.DocProfile:
    properties:
      all_caps_short_line_count:
        type: integer
      avg_line_len:
        type: number
      blank_paragraph_breaks:
        type: integer
      chinese_chapter_count:
        type: integer
      code_ratio:
        type: number
      detected_langs:
        description: Detected language hints (best-effort)
        items:
          type: string
        type: array
      english_chapter_count:
        type: integer
      form_feed_count:
        type: integer
      german_chapter_count:
        type: integer
      has_code:
        type: boolean
      has_tables:
        description: Content characteristics
        type: boolean
      md_heading_counts:
        additionalProperties:
          type: integer
        description: Markdown structure
        type: object
      md_heading_total:
        type: integer
      numbered_section_count:
        description: Heuristic indicators
        type: integer
      repeated_footer_count:
        type: integer
      std_line_len:
        type: number
      total_chars:
        type: integer
      total_lines:
        type: integer
      visual_sep_count:
        type: integer
    type: object
  github_com_Tencent_Reliquary_internal_infrastructure_chunker.StrategyTier:
    enum:
      - heading
      - heuristic
      - legacy
    type: string
    x-enum-varnames:
      - TierHeading
      - TierHeuristic
      - TierLegacy
  github_com_Tencent_Reliquary_internal_infrastructure_chunker.TierRejection:
    properties:
      reason:
        type: string
      tier:
        $ref: '#/definitions/github_com_Tencent_Reliquary_internal_infrastructure_chunker.StrategyTier'
    type: object
  github_com_Tencent_Reliquary_internal_models_limiter.RuntimeStat:
    properties:
      active:
        type: integer
      limit:
        type: integer
      model_id:
        type: string
      name:
        type: string
      waiting:
        type: integer
    type: object
  github_com_Tencent_Reliquary_internal_types.ASRConfig:
    properties:
      enabled:
        type: boolean
      language:
        description: 'optional: language hint for transcription'
        type: string
      model_id:
        type: string
    type: object
  github_com_Tencent_Reliquary_internal_types.AdminCreateUserRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        maxLength: 50
        minLength: 2
        type: string
    required:
      - email
      - username
    type: object
  github_com_Tencent_Reliquary_internal_types.AgentStep:
    properties:
      iteration:
        description: Iteration number (0-indexed)
        type: integer
      reasoning_content:
        description: |-
          ReasoningContent stores the OpenAI-protocol reasoning_content emitted by the
          model in this round. Persisted on AgentStep so cross-turn replay can put it
          back on the assistant message — required by MiMo / DeepSeek V3.2+ thinking
          mode, ignored by providers that don't recognize the field.
        type: string
      thought:
        description: LLM's reasoning/thinking (Think phase)
        type: string
      timestamp:
        description: When this step occurred
        type: string
      tool_calls:
        description: Tools called in this step (Act phase)
        items:
          $ref: '#/definitions/github_com_Tencent_Reliquary_internal_types.ToolCall'
        type: array
    type: object
  github_com_Tencent_Reliquary_internal_types.AnswerStrategy:
    enum:
      - all
      - random
    type: string
    x-enum-varnames:
      - AnswerStrategyAll
      - AnswerStrategyRandom
  github_com_Tencent_Reliquary_internal_types.AutoTagConfig:
    properties:
      enabled:
        type: boolean
      max_tags:
        type: integer
      model_id:
        type: string
      skip_if_tagged:
        description: |-
          SkipIfTagged leaves documents that already carry tags untouched, so a
          deliberate manual classification is not diluted by model guesses. It is
          a pointer because the default is true: rows written before this field
          existed decode to nil and must not silently flip to "always append".
        type: boolean
    type: object
  github_com_Tencent_Reliquary_internal_types.ChatHistoryConfig:
    properties:
      embedding_model_id:
        description: |-
          EmbeddingModelID is the ID of the embedding model used for vectorizing chat messages.
          Once messages have been indexed, the model cannot be changed (requires re-indexing).
        type: string
      enabled:
        description: Enabled controls whether chat history indexing is active
        type: boolean
      knowledge_base_id:
        description: |-
          KnowledgeBaseID is the auto-managed hidden knowledge base for chat history.
          This is set internally when the feature is first enabled; users should not set this directly.
        type: string
    type: object
  github_com_Tencent_Reliquary_internal_types.ChunkingConfig:
    properties:
      child_chunk_size:
        description: |-
          ChildChunkSize is the size of child chunks used for embedding (default: 384).
          Only used when EnableParentChild is true.
        type: integer
      chunk_overlap:
        description: Chunk overlap
        type: integer
      chunk_size:
        description: Chunk size
        type: integer
      enable_parent_child:
        description: |-
          EnableParentChild enables two-level parent-child chunking strategy.
          When enabled, large parent chunks provide context while small child chunks
          are used for vector matching. Retrieval matches on child but returns parent content.
        type: boolean
      languages:
        description: |-
          Languages hints the heuristic patterns. Empty = auto-detect from content.
          Examples: ["de"], ["en", "zh"].
        items:
          type: string
        type: array
      parent_chunk_size:
        description: |-
          ParentChunkSize is the size of parent chunks (default: 4096).
          Only used when EnableParentChild is true.
        type: integer
      parser_engine_rules:
        description: |-
          ParserEngineRules configures which parser engine to use for each file type.
          When empty, DefaultParserEngine is used (builtin/simple routing, except
          types that only a specific engine can parse: ppt/pptx fall back to
          markitdown). A linked anydoc binding is preferred for every type it
          converts.
        items:
          $ref: '#/definitions/github_com_Tencent_Reliquary_internal_types.ParserEngineRule'
        type: array
      separators:
        description: Separators
        items:
          type: string
        type: array
      strategy:
        description: |-
          Strategy selects the adaptive chunking tier. Empty / "legacy" preserves
          the historical recursive splitter; "auto" lets a profiler pick between
          heading-aware, heuristic and recursive tiers; "heading" / "heuristic" /
          "recursive" pin the tier explicitly.
        type: string
      table_metadata_instructions:
        description: |-
          TableMetadataInstructions contains optional business guidance used when
          generating searchable summaries for CSV/Excel tables. The system-owned
          output contract remains fixed; these instructions only add domain context.
        type: string
      token_limit:
        description: |-
          TokenLimit caps chunk size in approximate tokens. 0 = use ChunkSize
          as a character count.
        type: integer
    type: object
  github_com_Tencent_Reliquary_internal_types.ContextCompressionStrategy:
    enum:
      - sliding_window
      - smart
    type: string
    x-enum-varnames:
      - ContextCompressionSlidingWindow
      - ContextCompressionSmart
  github_com_Tencent_Reliquary_internal_types.ContextConfig:
    properties:
      compression_strategy:
        allOf:
          - $ref: '#/definitions/github_com_Tencent_Reliquary_internal_types.ContextCompressionStrategy'
        description: 'Compression strategy: "sliding_window" or "smart"'
      max_tokens:
        description: Maximum tokens allowed in LLM context
        type: integer
      recent_message_count:
        description: |-
          For sliding_window: number of messages to keep
          For smart: number of recent messages to keep uncompressed
        type: integer
      summarize_threshold:
        description: 'Summarize threshold: number of messages before summarization'
        type: integer
    type: object
  github_com_Tencent_Reliquary_internal_types.CredentialsConfig:
    properties:
      weknoracloud:
        $ref: '#/definitions/github_com_Tencent_Reliquary_internal_types.WeKnoraCloudCredentials'
    type: object
  github_com_Tencent_Reliquary_internal_types.CustomAgentConfig:
    properties:
      agent_mode:
        description: |-
          ===== Basic Settings =====
          Agent mode: "quick-answer" for RAG mode, "smart-reasoning" for ReAct agent mode
        type: string
      agent_type:
        description: |-
          AgentType is a preset category under smart-reasoning mode that pre-fills
          system prompt, allowed tools and recommended KB compatibility.
          Valid values: "rag-qa", "wiki-qa", "hybrid-rag-wiki", "custom".
          Empty / unknown values are treated as "custom" (no preset applied).
          Ignored for quick-answer mode.
        type: string
      allowed_tools:
        description: Allowed tools (only for agent type)
        items:
          type: string
        type: array
      asr_model_id:
        description: ASR model ID for audio transcription (optional)
        type: string
      attachment_image_understanding:
        description: |-
          AttachmentImageUnderstanding enables VLM OCR fallback for image-only /
          scanned documents (PDF/PPT whose pages are images). Disabled by default
          because it materially increases parse latency; only triggers when the
          extracted text is below a threshold and a VLM model is configured.
        type: boolean
      attachment_ocr_max_pages:
        description: |-
          AttachmentOCRMaxPages caps how many pages of a scanned / image-only
          document this agent sends to the VLM for OCR. 0 falls back to the global
          default (RELIQUARY_CHAT_ATTACHMENT_OCR_MAX_PAGES). More pages means higher
          coverage but slower parsing and more VLM cost.
        type: integer
      attachment_parse_wait_timeout_sec:
        description: |-
          AttachmentParseWaitTimeoutSec bounds, in seconds, how long a chat turn
          waits for this agent's still-parsing attachments before proceeding with
          only the finished ones. 0 falls back to the global default
          (RELIQUARY_CHAT_ATTACHMENT_WAIT_TIMEOUT_SEC).
        type: integer
      audio_upload_enabled:
        description: 'Whether audio upload (ASR transcription) is enabled for this agent (default: false)'
        type: boolean
      chat_parser_engine_rules:
        description: |-
          ===== Chat Attachment Parsing Settings =====
          ChatParserEngineRules selects parser engines for session-scoped chat
          attachments by file type. Takes precedence over the tenant-level
          ParserEngineConfig.ChatParserEngineRules; an explicit per-request
          parser_engine still overrides both.
        items:
          $ref: '#/definitions/github_com_Tencent_Reliquary_internal_types.ParserEngineRule'
        type: array
      citation_enabled:
        description: |-
          Whether final answers include knowledge/web source citations. Nil defaults to true
          so agents saved before this option was introduced keep their existing behavior.
        type: boolean
      context_template:
        description: Context template for normal mode (how to format retrieved chunks)
        type: string
      context_template_id:
        description: |-
          ContextTemplateID references a template ID in prompt_templates/ YAML files.
          If set and ContextTemplate is empty, the template content will be resolved at startup.
        type: string
      data_analysis_enabled:
        description: |-
          ===== Data Analysis Settings =====
          Whether to run the legacy in-pipeline DuckDB SQL data-analysis stage when
          the retrieved chunks include CSV/Excel files. This issues an extra LLM
          call to generate a SQL query and is disabled by default because most
          quick-answer / RAG-style agents do not want the added latency.
        type: boolean
      embedding_top_k:
        description: |-
          ===== Retrieval Strategy Settings (for both modes) =====
          Embedding/Vector retrieval top K
        type: integer
      enable_query_expansion:
        description: |-
          ===== Advanced Settings (mainly for normal mode) =====
          Whether to enable query expansion
        type: boolean
      enable_rewrite:
        description: Whether to enable query rewrite for multi-turn conversations
        type: boolean
      fallback_prompt:
        description: Fallback prompt (when FallbackStrategy is "model")
        type: string
      fallback_response:
        description: Fixed fallback response (when FallbackStrategy is "fixed")
        type: string
      fallback_strategy:
        description: 'Fallback strategy: "fixed" for fixed response, "model" for model generation'
        type: string
      history_turns:
        description: Number of history turns to keep in context
        type: integer
      image_upload_enabled:
        description: |-
          ===== Image Upload / Multimodal Settings =====
          Whether image upload is enabled for this agent (default: false)
        type: boolean
      intent_prompts:
        additionalProperties:
          type: string
        description: |-
          IntentPrompts holds per-intent system prompt overrides for non-retrieval
          intents (greeting, chitchat, etc.). Empty values fall back to templates
          under config/prompt_templates/intent_prompts.yaml.
        type: object
      kb_selection_mode:
        description: |-
          ===== Knowledge Base Settings =====
          Knowledge base selection mode: "all" = all KBs, "selected" = specific KBs, "none" = no KB
        type: string
      keyword_threshold:
        description: Keyword retrieval threshold
        type: number
      knowledge_bases:
        description: Associated knowledge base IDs (only used when KBSelectionMode is "selected")
        items:
          type: string
        type: array
      llm_call_timeout:
        description: Timeout for a single LLM call in seconds (0 = use global default)
        type: integer
      max_completion_tokens:
        description: |-
          Maximum completion tokens. Quick-answer uses this for the RAG answer.
          Smart-reasoning ReAct rounds send this value as-is (zero becomes
          DefaultMaxCompletionTokens at call time: 4096, or 24576 with a sandbox).
        type: integer
      max_iterations:
        description: |-
          ===== Agent Mode Settings =====
          Maximum iterations for the ReAct loop. Zero is unset (filled with a
          default). A negative value is unlimited: the loop runs until the model
          stops, the user cancels, or another guard fires.
        type: integer
      mcp_auth_wait_timeout:
        description: |-
          MCPAuthWaitTimeout is how many seconds to wait for in-conversation OAuth
          authorization before skipping. <=0 uses the gate's configured timeout.
        type: integer
      mcp_selection_mode:
        description: 'MCP service selection mode: "all" = all enabled MCP services, "selected" = specific services, "none" = no MCP'
        type: string
      mcp_services:
        description: Selected MCP service IDs (only used when MCPSelectionMode is "selected")
        items:
          type: string
        type: array
      memory_enabled:
        description: |-
          Whether this agent may read the user's long-term memory. Nil inherits
          the workspace setting; false opts a single agent out of memory even when
          the workspace has it on. There is no "on" that overrides the workspace.
        type: boolean
      model_id:
        description: |-
          ===== Model Settings =====
          Model ID to use for conversations
        type: string
      multi_turn_enabled:
        description: |-
          ===== Multi-turn Conversation Settings =====
          Whether multi-turn conversation is enabled
        type: boolean
      query_understand_model_id:
        description: |-
          Dedicated chat model ID for the query-understanding (rewrite + intent) step.
          When empty, the main conversation ModelID is used as a fallback.
        type: string
      question_suggestions:
        allOf:
          - $ref: '#/definitions/github_com_Tencent_Reliquary_internal_types.QuestionSuggestionConfig'
        description: |-
          ===== Conversation Question Suggestions =====
          QuestionSuggestions owns both the static/knowledge-backed prompts shown
          before the first user turn and the contextual follow-up questions shown
          after a completed assistant answer.
      rerank_model_id:
        description: ReRank model ID for retrieval
        type: string
      rerank_threshold:
        description: Rerank threshold
        type: number
      rerank_top_k:
        description: Rerank top K
        type: integer
      retain_retrieval_history:
        description: Whether to retain retrieval history across turns
        type: boolean
      retrieve_kb_only_when_mentioned:
        description: |-
          Whether to retrieve knowledge base only when explicitly mentioned with @ (default: false)
          When true, knowledge base retrieval only happens if user explicitly mentions KB/files with @
          When false, knowledge base retrieval happens according to KBSelectionMode
        type: boolean
      rewrite_prompt_system:
        description: Rewrite prompt system message
        type: string
      rewrite_prompt_user:
        description: Rewrite prompt user message template
        type: string
      sandbox_config_id:
        description: |-
          ===== Sandbox Settings =====
          SandboxConfigID selects which workspace sandbox config this agent's
          skill scripts run on. Empty means sandbox execution is disabled.

          This references the LOGICAL config, never a specific revision: keeping
          the indirection here is what would let credential rotation happen
          without re-pointing every agent (see the spec's §4.8).
        type: string
      selected_skills:
        description: Selected skill names (only used when SkillsSelectionMode is "selected")
        items:
          type: string
        type: array
      skills_selection_mode:
        description: |-
          ===== Skills Settings (only for smart-reasoning mode) =====
          Skills selection mode: "all" = all preloaded skills, "selected" = specific skills, "none" = no skills
        type: string
      supported_file_types:
        description: |-
          ===== File Type Restriction Settings =====
          Supported file types for this agent (e.g., ["csv", "xlsx", "xls"])
          Empty means all file types are supported
          When set, only files with matching extensions can be used with this agent
        items:
          type: string
        type: array
      system_prompt:
        description: System prompt for the agent
        type: string
      system_prompt_id:
        description: |-
          SystemPromptID references a template ID in prompt_templates/ YAML files.
          If set and SystemPrompt is empty, the template content will be resolved at startup.
        type: string
      temperature:
        description: Temperature for LLM (0-1)
        type: number
      thinking:
        description: Whether to enable thinking mode (for models that support extended thinking)
        type: boolean
      vector_threshold:
        description: Vector retrieval threshold
        type: number
      vlm_model_id:
        description: VLM model ID for image analysis (optional, falls back to workspace-level VLM)
        type: string
    type: object
  github_com_Tencent_Reliquary_internal_types.DataSource:
    properties:
      config:
        description: |-
          Encrypted configuration (API credentials, tokens, etc.)
          Stored as JSON with AES-256-GCM encryption
        items:
          type: integer
        type: array
      conflict_strategy:
        description: 'Conflict resolution strategy: overwrite or skip'
        type: string
      created_at:
        description: Creation timestamp
        type: string
      deleted_at:
        allOf:
          - $ref: '#/definitions/gorm.DeletedAt'
        description: Soft delete timestamp
      error_message:
        description: Error message if status is "error"
        type: string
      id:
        description: Unique identifier
        type: string
      knowledge_base_id:
        description: Target knowledge base ID
        type: string
      last_sync_at:
        description: Last successful sync timestamp
        type: string
      last_sync_cursor:
        description: Cursor or state for incremental sync (connector-specific)
        items:
          type: integer
        type: array
      last_sync_result:
        description: Summary of last sync result
        items:
          type: integer
        type: array
      latest_sync_log:
        allOf:
          - $ref: '#/definitions/github_com_Tencent_Reliquary_internal_types.SyncLog'
        description: Latest sync log (not stored in DB, populated on query)
      name:
        description: User-friendly name
        type: string
      status:
        description: 'Current status: active, paused, error'
        type: string
      sync_deletions:
        description: Whether to sync deletions from source
        type: boolean
      sync_log_retention_days:
        description: 'Number of days to keep sync logs (default: 30)'
        type: integer
      sync_mode:
        description: 'Sync mode: "incremental" (recommended) or "full"'
        type: string
      sync_schedule:
        description: Cron expression for scheduled syncs (e.g., "0 */6 * * *" = every 6 hours)
        type: string
      tenant_id:
        description: Workspace ID for multi-workspace isolation
        type: integer
      total_items_synced:
        description: Total items synced (not stored in DB, calculated on query)
        type: integer
      type:
        description: Connector type (rss).
        type: string
      updated_at:
        description: Last update timestamp
        type: string
    type: object
  github_com_Tencent_Reliquary_internal_types.DockerSandboxConfig:
    properties:
      cpu_limit:
        description: |-
          CPULimit is the number of CPU cores one sandbox may use. 0 uses the
          built-in default.
        type: number
      host:
        description: |-
          Host is the daemon endpoint in DOCKER_HOST form. Empty means the local
          unix socket.
        type: string
      http_timeout_sec:
        description: HTTPTimeoutSec bounds each Engine API call. 0 uses the built-in default.
        type: integer
      idle_ttl_seconds:
        description: |-
          IdleTTLSeconds is how long a session container may go unused before it
          is reclaimed. The daemon has no idle timeout of its own, so this is what
          stops an abandoned session from pinning host memory indefinitely.
        type: integer
      image:
        type: string
      memory_limit_mb:
        description: MemoryLimitMB caps one sandbox's memory. 0 uses the built-in default.
        type: integer
      network_mode:
        description: |-
          NetworkMode is the Docker network sandboxes join: "bridge" (default) or
          "none" for no egress. Nothing else is accepted — host and container:
          modes share another namespace outright, and a named network is usually
          the deployment's own compose network, which would put the sandbox next
          to Postgres and Redis.
        type: string
      pids_limit:
        description: |-
          PidsLimit caps how many processes one sandbox may run. 0 uses the
          built-in default.
        type: integer
      runtime:
        description: |-
          Runtime selects an alternative OCI runtime such as "runsc" (gVisor).
          Empty uses the daemon default.
        type: string
      tls_cert_path:
        description: |-
          TLSCertPath is a directory on the Reliquary host containing ca.pem,
          cert.pem and key.pem. Required when Host is a TCP endpoint.
        type: string
    type: object
  github_com_Tencent_Reliquary_internal_types.EmbeddingParameters:
    properties:
      dimension:
        type: integer
      supports_dimension_override:
        type: boolean
      truncate_prompt_tokens:
        type: integer
    type: object
  github_com_Tencent_Reliquary_internal_types.FollowUpSuggestionConfig:
    properties:
      additional_instruction:
        type: string
      allow_regenerate:
