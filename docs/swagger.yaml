            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_Tencent_Reliquary_internal_errors.AppError'
      security:
        - Bearer: []
      summary: 跳过对话内 MCP OAuth 授权
      tags:
        - MCP服务
  /agent/tool-approvals/{pending_id}:
    post:
