        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Tencent_Reliquary_internal_errors.AppError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_Tencent_Reliquary_internal_errors.AppError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_Tencent_Reliquary_internal_errors.AppError'
      security:
        - Bearer: []
