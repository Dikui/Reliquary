    get:
      description: Retrieve a wiki page by its slug
      parameters:
        - description: Knowledge base ID
          in: path
          name: kb_id
          required: true
          type: string
        - description: Page slug
          in: path
          name: slug
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Tencent_Reliquary_internal_types.WikiPage'
