  github_com_Tencent_Reliquary_internal_types.RetrievalConfig:
    properties:
      embedding_top_k:
        description: 'EmbeddingTopK is the maximum number of chunks returned by vector search (default: 50)'
        type: integer
      keyword_threshold:
        description: 'KeywordThreshold is the minimum keyword match score (0-1, default: 0.3)'
        type: number
      rerank_model_id:
        description: RerankModelID is the ID of the rerank model to use (required for search)
        type: string
      rerank_threshold:
        description: 'RerankThreshold is the minimum rerank score (-10 to 10, default: 0.2)'
        type: number
      rerank_top_k:
        description: 'RerankTopK is the maximum number of results after reranking (default: 10)'
        type: integer
      rrf_k:
        description: |-
          RRFK is the smoothing constant of Reciprocal Rank Fusion. Larger values
          flatten the curve, reducing the bias towards top-1 results.
          Default: 60. Sensible range: 30..100 depending on corpus size.
        type: integer
      rrf_keyword_weight:
        description: 'RRFKeywordWeight is the keyword counterpart. Default: 0.3.'
        type: number
      rrf_vector_weight:
        description: |-
          RRFVectorWeight is the weight applied to the vector retriever inside RRF.
          RRFVectorWeight + RRFKeywordWeight should usually sum to 1.0 but the math
          works for any positive weights. Default: 0.7.
        type: number
      vector_threshold:
        description: 'VectorThreshold is the minimum vector similarity score (0-1, default: 0.15)'
        type: number
    type: object
