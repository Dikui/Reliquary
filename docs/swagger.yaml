  /knowledgebase/{kb_id}/wiki/revert:
    post:
      consumes:
        - application/json
      description: |-
        Rolls the page (slug in the body, like move-page) back to
        the content of the given stored revision. Applied as a
        regular edit: the pre-revert state is snapshotted and the
        version advances.
      parameters:
        - description: Knowledge base ID
          in: path
          name: kb_id
          required: true
          type: string
        - description: Revert target
          in: body
          name: revert
          required: true
