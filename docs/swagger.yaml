        - Wiki
  /knowledgebase/{kb_id}/wiki/revisions/{slug}:
    get:
      description: |-
        Returns the stored historical snapshots for a page, newest
        first (content omitted), plus the current version. Passing
        `version` returns that single snapshot with full content.
      parameters:
        - description: Knowledge base ID
          in: path
          name: kb_id
          required: true
          type: string
        - description: Page slug
          in: path
          name: slug
          required: true
          type: string
        - description: Return this single revision with content
          in: query
          name: version
          type: integer
        - description: Page size (default 50, max 200)
          in: query
          name: limit
          type: integer
        - description: Offset into the newest-first list
          in: query
          name: offset
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Tencent_Reliquary_internal_types.WikiPageRevisionListResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_Tencent_Reliquary_internal_errors.AppError'
      security:
