  title: Reliquary API
  version: "1.0"
paths:
  /agent-chat/{session_id}:
    post:
      consumes:
        - application/json
      description: 基于Agent的智能问答，支持多轮对话和SSE流式响应
      parameters:
        - description: 会话ID
          in: path
          name: session_id
          required: true
          type: string
        - description: 问答请求
          in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/internal_handler_session.CreateKnowledgeQARequest'
        - default: handle
          description: 文件引用形式，public 返回可加载直链
          enum:
            - handle
            - public
          in: query
          name: resource_urls
          type: string
      produces:
        - text/event-stream
      responses:
        "200":
          description: 问答结果（SSE流）
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/github_com_Tencent_Reliquary_internal_errors.AppError'
      security:
        - Bearer: []
        - ApiKeyAuth: []
      summary: Agent问答
      tags:
        - 问答
  /agent/mcp-oauth-resolutions/{pending_id}:
    post:
      consumes:
        - application/json
      description: 用户在对话中完成 OAuth 授权后调用，校验令牌存在后恢复被暂停的 Agent 工具调用
      parameters:
        - description: 待授权 ID
          in: path
          name: pending_id
          required: true
          type: string
        - description: '{service_id: string}'
          in: body
          name: request
          required: true
          schema:
            additionalProperties: true
            type: object
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Tencent_Reliquary_internal_errors.AppError'
        "409":
          description: 用户尚未完成授权
          schema:
            $ref: '#/definitions/github_com_Tencent_Reliquary_internal_errors.AppError'
      security:
        - Bearer: []
      summary: 完成对话内 MCP OAuth 授权
      tags:
        - MCP服务
  /agent/mcp-oauth-resolutions/{pending_id}/cancel:
