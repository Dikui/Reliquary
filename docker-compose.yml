services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - Reliquary-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    image: reliquary-ui:${RELIQUARY_VERSION:-0.8.0}
    pull_policy: build
    # Requires frontend/dist — run ./scripts/build-frontend-dist.sh before --build
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - DEFAULT_LOCALE=${DEFAULT_LOCALE:-}
      - APP_HOST=${APP_HOST:-app}
      # APP_BACKEND_PORT: the port NGINX proxies to (default 8080).
      # For local deployment this is the App container's listening port, independent of host-mapped APP_PORT.
      # For remote deployment, set this to the remote App's service port.
      - APP_PORT=${APP_BACKEND_PORT:-8080}
      - APP_SCHEME=${APP_SCHEME:-http}
    # NOTE: If using a remote App backend, comment out or remove the depends_on
    # block below and set APP_HOST/APP_BACKEND_PORT/APP_SCHEME in your .env file.
    depends_on:
      app:
        condition: service_healthy
    networks:
      - Reliquary-network
    restart: unless-stopped

  app:
    image: reliquary-app:${RELIQUARY_VERSION:-0.8.0}
    pull_policy: build
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        - APK_MIRROR_ARG=${APK_MIRROR_ARG:-}
        - WITH_ANYDOC=${WITH_ANYDOC:-1}
        - VERSION_ARG=${RELIQUARY_VERSION:-0.8.0}
        - COMMIT_ID_ARG=${RELIQUARY_COMMIT:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      # Run ./reliquary-admin check-deployment before starting the containers.
      - type: bind
        source: ${RELIQUARY_FILES_DIR:-${HOME}/Reliquary/files}
        target: ${LOCAL_STORAGE_BASE_DIR:-/data/files}
        bind:
          create_host_path: false
      - type: bind
        source: ${RELIQUARY_VAULT_DIR:-${HOME}/Reliquary/vault}
        target: ${VAULT_ROOT:-/data/vault}
        bind:
          create_host_path: false
      - ./config/config.yaml:/app/config/config.yaml
      # Optional: declarative built-in models. Copy config/builtin_models.yaml.example
      # to config/builtin_models.yaml, edit it for your deployment, then
      # uncomment the line below. See docs/builtin-models.md.
      # - ./config/builtin_models.yaml:/app/config/builtin_models.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Source .env so deployment-specific variables (e.g. those referenced by
    # config/builtin_models.yaml via ${ENV}, or any future feature) reach the
    # app container without having to be enumerated under `environment:`.
    #
    # NOTE: the array form below is used instead of the map form
    # (env_file: - path: .env, required: false) because the map syntax
    # requires Docker Compose v2.24+ (Jan 2024) and would break parsing on
    # older deploys. The trade-off is that Compose errors out if .env is
    # absent — see scripts/start-all.sh for the pre-flight touch that keeps
    # fresh clones working.
    env_file:
      - .env
    environment:
      # ========== 日志 ==========
      # 日志级别，默认debug
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      # 日志文件路径（留空则只输出 stdout）；LLM_DEBUG_LOG 开启时同目录写 llm_debug.log
      - LOG_PATH=${LOG_PATH:-}
      # 自定义日志格式模板（留空用内置默认格式）
      - LOG_FORMAT=${LOG_FORMAT:-}
      # LLM 调试日志：true 写 LOG_PATH 同目录 llm_debug.log，或指定路径；留空关闭
      - LLM_DEBUG_LOG=${LLM_DEBUG_LOG:-false}
      # ========== 运行时基础 ==========
      # gin mod
      # 可选值: debug(开发模式，有详细日志), release(生产模式)
      - GIN_MODE=${GIN_MODE:-release}
      # 时区，默认为Asia/Shanghai
      - TZ=${TZ:-Asia/Shanghai}
      # 文档解析语言。优先级：此环境变量（部署级覆盖，非空即生效）
      # > Accept-Language 请求头 > 内置默认值 (zh-CN)。留空则跟随请求方 Accept-Language。
      - RELIQUARY_LANGUAGE=${RELIQUARY_LANGUAGE:-}
      # 系统管理员也可在「设置 → 系统设置」打开（立即生效）。未落库时读本变量。
      # gin 信任的代理 CIDR（逗号分隔）；显式设为空字符串则禁用代理信任。
      # 默认信任 loopback + 私网段（容器网络内 nginx 已覆盖）
      # - RELIQUARY_TRUSTED_PROXIES=${RELIQUARY_TRUSTED_PROXIES:-}
      # 启动时自动执行数据库迁移；设为 false 禁用，默认启用
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
      # 文件与图片直链使用的外部地址，供 /r/ 路由生成可访问 URL。
      # - APP_EXTERNAL_URL=${APP_EXTERNAL_URL:-}

      # 个人账号认证
      # 数据库设置
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - REDIS_DB=${REDIS_DB:-0}
      - RELIQUARY_QUEUE_SWEEP_INTERVAL=${RELIQUARY_QUEUE_SWEEP_INTERVAL:-1m}
      - RELIQUARY_QUEUE_DELIVERY_TIMEOUT=${RELIQUARY_QUEUE_DELIVERY_TIMEOUT:-2m}
      - DB_DRIVER=${DB_DRIVER:-postgres}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_NAME=${DB_NAME:-}
      # ========== 文件存储 ==========
      - LOCAL_STORAGE_BASE_DIR=${LOCAL_STORAGE_BASE_DIR:-/data/files}
      - VAULT_ROOT=${VAULT_ROOT:-/data/vault}
      - BACKUP_DIR=${BACKUP_DIR:-${HOME}/Backups/Reliquary}
      - VAULT_HEADER_DEBOUNCE=${VAULT_HEADER_DEBOUNCE:-5s}
      - AUTO_RECOVER_DIRTY=${AUTO_RECOVER_DIRTY:-true}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Ollama 不可用时仅告警不阻断（true 时生效）
      - OLLAMA_OPTIONAL=${OLLAMA_OPTIONAL:-true}
      # 批量 embedding 大小
      - BATCH_EMBED_SIZE=${BATCH_EMBED_SIZE:-}
      # LLM 流原始转储（排查上下文问题；1 启用，默认目录 ~/.reliquary/investigate/llm-stream）
      - RELIQUARY_LLM_STREAM_RAW_DUMP=${RELIQUARY_LLM_STREAM_RAW_DUMP:-}
      - RELIQUARY_LLM_STREAM_RAW_DUMP_DIR=${RELIQUARY_LLM_STREAM_RAW_DUMP_DIR:-}
      # 数据库中 API Key 等敏感字段落盘加密的 AES-256 主密钥（必须为 32 字节）。
      # 加密范围：api_keys.api_key、模型 API key 等敏感字段。
      # 密钥不随备份或迁移包保存；新环境生成新密钥并重新填写凭据。
      # 生产环境必须显式设置且妥善保管。
      # （TENANT_AES_KEY / CRYPTO_MASTER_KEY / CRYPTO_SALT 已废弃：v0.4.0 起加密统一
      #   改用 SYSTEM_AES_KEY，Go 主应用不再读取这三个变量。）
      - SYSTEM_AES_KEY=${SYSTEM_AES_KEY:-}
      # ChatGPT 授权回调使用宿主机映射的 API 端口，返回链接使用网页端口。
      - CHATGPT_CALLBACK_URL=${CHATGPT_CALLBACK_URL:-http://127.0.0.1:8080/auth/callback}
      - CHATGPT_SETTINGS_URL=${CHATGPT_SETTINGS_URL:-http://127.0.0.1/platform/settings?section=models}
      - SSRF_WHITELIST=${SSRF_WHITELIST:-}
      # 默认放行本机代理 fake-ip 使用的基准测试保留网段；显式设为空字符串即关闭。
      - SSRF_WHITELIST_EXTRA=${SSRF_WHITELIST_EXTRA-198.18.0.0/15}
      # 保留原始 URL 的图片域名白名单（逗号分隔，不替换为 provider://）
      - IMAGE_HOST_KEEP_URL=${IMAGE_HOST_KEEP_URL:-}
      - CONCURRENCY_POOL_SIZE=${CONCURRENCY_POOL_SIZE:-5}
      - JWT_SECRET=${JWT_SECRET:-}
      # File size limit (in MB)
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      # 文档处理任务总超时（Go duration，默认 2h）
      - RELIQUARY_DOCUMENT_PROCESS_TIMEOUT=${RELIQUARY_DOCUMENT_PROCESS_TIMEOUT:-}
      # 单次解析调用超时（默认 30m，须小于文档任务总超时）
      - PARSER_CALL_TIMEOUT=${PARSER_CALL_TIMEOUT:-}
      # 库巡检回收（回收卡在 processing 的脏数据；false 禁用，不建议）
      - RELIQUARY_HOUSEKEEPING_ENABLED=${RELIQUARY_HOUSEKEEPING_ENABLED:-}
      - RELIQUARY_QUEUE_CORE_CONCURRENCY=${RELIQUARY_QUEUE_CORE_CONCURRENCY:-8}
      - RELIQUARY_QUEUE_ENRICHMENT_CONCURRENCY=${RELIQUARY_QUEUE_ENRICHMENT_CONCURRENCY:-12}
      - RELIQUARY_QUEUE_MAINTENANCE_CONCURRENCY=${RELIQUARY_QUEUE_MAINTENANCE_CONCURRENCY:-4}
      - RELIQUARY_QUEUE_SHARED_CONCURRENCY=${RELIQUARY_QUEUE_SHARED_CONCURRENCY:-6}
      - RELIQUARY_MODEL_MAX_CONCURRENCY=${RELIQUARY_MODEL_MAX_CONCURRENCY:-32}
      - APK_MIRROR_ARG=${APK_MIRROR_ARG:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - Reliquary-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"


  postgres:
    image: paradedb/paradedb:v0.22.2-pg17@sha256:af585013f97f622715de01e48d00558f7edf17055d7b40deafc9f98ca8d99a56
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - Reliquary-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s # 增加时间间隔
      timeout: 10s # 增加超时时间
      retries: 3 # 减少重试次数，让失败更快反馈
      start_period: 30s # 给予初始启动更多时间
    restart: unless-stopped
    # 添加停机时的优雅退出时间
    stop_grace_period: 1m


networks:
  Reliquary-network:
    driver: bridge

volumes:
  postgres-data:
