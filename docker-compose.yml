services:
  frontend:
    image: reliquary-ui:${RELIQUARY_VERSION:-latest}
    pull_policy: build
    # Requires frontend/dist — run ./scripts/build_frontend_dist.sh before --build
    build:
      context: ./frontend
    container_name: Reliquary-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - MAX_SKILL_BUNDLE_SIZE_MB=${MAX_SKILL_BUNDLE_SIZE_MB:-256}
      - DEFAULT_LOCALE=${DEFAULT_LOCALE:-}
      - APP_HOST=${APP_HOST:-app}
      # APP_BACKEND_PORT: the port NGINX proxies to (default 8080).
      # For local deployment this is the App container's listening port, independent of host-mapped APP_PORT.
      # For remote deployment, set this to the remote App's service port.
      - APP_PORT=${APP_BACKEND_PORT:-8080}
      - APP_SCHEME=${APP_SCHEME:-http}
    # NOTE: If using a remote App backend, comment out or remove the depends_on
    # block below and set APP_HOST/APP_BACKEND_PORT/APP_SCHEME in your .env file.
    depends_on:
      app:
        condition: service_healthy
    networks:
      - Reliquary-network
    restart: unless-stopped

  app:
    image: reliquary-app:${RELIQUARY_VERSION:-latest}
    pull_policy: build
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        - APK_MIRROR_ARG=${APK_MIRROR_ARG:-}
        - WITH_ANYDOC=${WITH_ANYDOC:-1}
    container_name: Reliquary-app
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - data-files:/data/files
      - ./config/config.yaml:/app/config/config.yaml
      # Optional: mount custom skills directory (allows adding skills without rebuilding image)
      - ./skills/preloaded:/app/skills/preloaded
      # Docker 沙箱默认关闭（见 RELIQUARY_SANDBOX_DOCKER_ENABLED）。需要本机 daemon 时
      # 同时设 true 并挂载实际 socket——这等同宿主机 root，仅私有化单机。
      # 入口脚本会按 socket GID 把 appuser 加入对应组（compose group_add 在 gosu 后无效）。
      # - /var/run/docker.sock:/var/run/docker.sock
      # Optional: declarative built-in models. Copy config/builtin_models.yaml.example
      # to config/builtin_models.yaml, edit it for your deployment, then
      # uncomment the line below. See docs/BUILTIN_MODELS.md.
      # - ./config/builtin_models.yaml:/app/config/builtin_models.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Source .env so deployment-specific variables (e.g. those referenced by
    # config/builtin_models.yaml via ${ENV}, or any future feature) reach the
    # app container without having to be enumerated under `environment:`.
    #
    # NOTE: the array form below is used instead of the map form
    # (env_file: - path: .env, required: false) because the map syntax
    # requires Docker Compose v2.24+ (Jan 2024) and would break parsing on
    # older deploys. The trade-off is that Compose errors out if .env is
    # absent — see scripts/start_all.sh for the pre-flight touch that keeps
    # fresh clones working.
    env_file:
      - .env
    environment:
      # ========== 日志 ==========
      # 日志级别，默认debug
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      # 日志文件路径（留空则只输出 stdout）；LLM_DEBUG_LOG 开启时同目录写 llm_debug.log
      - LOG_PATH=${LOG_PATH:-}
      # 自定义日志格式模板（留空用内置默认格式）
      - LOG_FORMAT=${LOG_FORMAT:-}
      # LLM 调试日志：true 写 LOG_PATH 同目录 llm_debug.log，或指定路径；留空关闭
      - LLM_DEBUG_LOG=${LLM_DEBUG_LOG:-false}
      # ========== 运行时基础 ==========
      # gin mod
      # 可选值: debug(开发模式，有详细日志), release(生产模式，禁用Swagger文档)
      - GIN_MODE=${GIN_MODE:-release}
      # 时区，默认为Asia/Shanghai
      - TZ=${TZ:-Asia/Shanghai}
      # 文档处理语言（问题/摘要生成）。优先级：此环境变量（部署级覆盖，非空即生效）
      # > Accept-Language 请求头 > 内置默认值 (zh-CN)。留空则跟随请求方 Accept-Language。
      - RELIQUARY_LANGUAGE=${RELIQUARY_LANGUAGE:-}
      # Docker 沙箱默认关闭：本机 docker.sock 等同宿主机 root。
      # 系统管理员也可在「设置 → 系统设置」打开（立即生效）。未落库时读本变量。
      - RELIQUARY_SANDBOX_DOCKER_ENABLED=${RELIQUARY_SANDBOX_DOCKER_ENABLED:-false}
      # gin 信任的代理 CIDR（逗号分隔）；显式设为空字符串则禁用代理信任。
      # 默认信任 loopback + 私网段（容器网络内 nginx 已覆盖）
      # - RELIQUARY_TRUSTED_PROXIES=${RELIQUARY_TRUSTED_PROXIES:-}
      # 启动时自动执行数据库迁移；设为 false 禁用，默认启用
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
      # 文件与图片直链使用的外部地址，供 /r/ 路由生成可访问 URL。
      # - APP_EXTERNAL_URL=${APP_EXTERNAL_URL:-}

      # 个人账号认证
      # 新建空间默认存储配额（GB，默认 10）
      - RELIQUARY_TENANT_DEFAULT_STORAGE_QUOTA_GB=${RELIQUARY_TENANT_DEFAULT_STORAGE_QUOTA_GB:-10}
      # 数据库设置
      - DB_DRIVER=${DB_DRIVER:-postgres}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_NAME=${DB_NAME:-}
      # ========== 文件存储 ==========
      - LOCAL_STORAGE_BASE_DIR=${LOCAL_STORAGE_BASE_DIR:-/data/files}
      - AUTO_RECOVER_DIRTY=${AUTO_RECOVER_DIRTY:-true}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Ollama 不可用时仅告警不阻断（true 时生效）
      - OLLAMA_OPTIONAL=${OLLAMA_OPTIONAL:-true}
      # 批量 embedding 大小
      - BATCH_EMBED_SIZE=${BATCH_EMBED_SIZE:-}
      # VLM 单次 HTTP 请求超时（秒，默认 180）
      - VLM_HTTP_TIMEOUT_SECONDS=${VLM_HTTP_TIMEOUT_SECONDS:-}
      # LLM 流原始转储（排查上下文问题；1 启用，默认目录 ~/.reliquary/investigate/llm-stream）
      - RELIQUARY_LLM_STREAM_RAW_DUMP=${RELIQUARY_LLM_STREAM_RAW_DUMP:-}
      - RELIQUARY_LLM_STREAM_RAW_DUMP_DIR=${RELIQUARY_LLM_STREAM_RAW_DUMP_DIR:-}
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - REDIS_USERNAME=${REDIS_USERNAME:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-}
      # Redis TLS（托管 Redis 加密传输；REDIS_USE_TLS=true 时生效，详见 .env.example）
      - REDIS_TLS_SERVER_NAME=${REDIS_TLS_SERVER_NAME:-}
      - REDIS_TLS_INSECURE_SKIP_VERIFY=${REDIS_TLS_INSECURE_SKIP_VERIFY:-}
      # Redis 频道命名空间后缀（多部署共享同一 Redis 时隔离用）
      - RELIQUARY_REDIS_NAMESPACE=${RELIQUARY_REDIS_NAMESPACE:-}
      # Asynq 客户端 Redis 读写超时（毫秒，默认 500）
      - RELIQUARY_REDIS_OP_TIMEOUT_MS=${RELIQUARY_REDIS_OP_TIMEOUT_MS:-}
      # 数据库中 API Key 等敏感字段落盘加密的 AES-256 主密钥（必须为 32 字节）。
      # 加密范围：tenants.api_key、模型 API key、web search provider key。
      # 需重新填写）。生产环境必须显式设置且妥善保管，丢失则所有加密数据不可恢复。
      # （TENANT_AES_KEY / CRYPTO_MASTER_KEY / CRYPTO_SALT 已废弃：v0.4.0 起加密统一
      #   改用 SYSTEM_AES_KEY，Go 主应用不再读取这三个变量。）
      - SYSTEM_AES_KEY=${SYSTEM_AES_KEY:-}
      - SSRF_WHITELIST=${SSRF_WHITELIST:-}
      # 保留原始 URL 的图片域名白名单（逗号分隔，不替换为 provider://）
      - IMAGE_HOST_KEEP_URL=${IMAGE_HOST_KEEP_URL:-}
      - CONCURRENCY_POOL_SIZE=${CONCURRENCY_POOL_SIZE:-5}
      - JWT_SECRET=${JWT_SECRET:-}
      # File size limit (in MB)
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      # Skill zip / GitHub source download cap (in MB); the GitHub zipball is the whole repo, not the skill subtree
      - MAX_SKILL_BUNDLE_SIZE_MB=${MAX_SKILL_BUNDLE_SIZE_MB:-256}
      # 文档处理任务总超时（Go duration，默认 2h）
      - RELIQUARY_DOCUMENT_PROCESS_TIMEOUT=${RELIQUARY_DOCUMENT_PROCESS_TIMEOUT:-}
      # 单次解析调用超时（默认 30m，须小于文档任务总超时）
      - PARSER_CALL_TIMEOUT=${PARSER_CALL_TIMEOUT:-}
      # 知识库巡检回收（回收卡在 processing 的脏数据；false 禁用，不建议）
      - RELIQUARY_HOUSEKEEPING_ENABLED=${RELIQUARY_HOUSEKEEPING_ENABLED:-}
      # 自定义 Skills 目录（挂载后指定，免重建镜像）
      - RELIQUARY_SKILLS_DIR=${RELIQUARY_SKILLS_DIR:-}
      - RELIQUARY_CHAT_ATTACHMENT_TTL_HOURS=${RELIQUARY_CHAT_ATTACHMENT_TTL_HOURS:-24}
      - RELIQUARY_CHAT_ATTACHMENT_WAIT_TIMEOUT_SEC=${RELIQUARY_CHAT_ATTACHMENT_WAIT_TIMEOUT_SEC:-60}
      - RELIQUARY_CHAT_ATTACHMENT_OCR_CONCURRENCY=${RELIQUARY_CHAT_ATTACHMENT_OCR_CONCURRENCY:-8}
      - RELIQUARY_CHAT_ATTACHMENT_OCR_MAX_PAGES=${RELIQUARY_CHAT_ATTACHMENT_OCR_MAX_PAGES:-8}
      # Agent LLM call timeout
      - RELIQUARY_AGENT_LLM_TIMEOUT=${RELIQUARY_AGENT_LLM_TIMEOUT:-}
      - RELIQUARY_AGENT_TOOL_APPROVAL_TIMEOUT=${RELIQUARY_AGENT_TOOL_APPROVAL_TIMEOUT:-}
      # MCP 工具人工审批失败时是否放行（true 放行 / 默认 fail-close 拒绝）
      - RELIQUARY_AGENT_TOOL_APPROVAL_FAIL_OPEN=${RELIQUARY_AGENT_TOOL_APPROVAL_FAIL_OPEN:-}
      # 个人空间存储配额
      - RELIQUARY_ASYNQ_CORE_CONCURRENCY=${RELIQUARY_ASYNQ_CORE_CONCURRENCY:-8}
      - RELIQUARY_ASYNQ_POSTPROCESS_CONCURRENCY=${RELIQUARY_ASYNQ_POSTPROCESS_CONCURRENCY:-2}
      - RELIQUARY_ASYNQ_ENRICHMENT_CONCURRENCY=${RELIQUARY_ASYNQ_ENRICHMENT_CONCURRENCY:-12}
      - RELIQUARY_ASYNQ_MAINTENANCE_CONCURRENCY=${RELIQUARY_ASYNQ_MAINTENANCE_CONCURRENCY:-4}
      - RELIQUARY_ASYNQ_SHARED_CONCURRENCY=${RELIQUARY_ASYNQ_SHARED_CONCURRENCY:-6}
      - RELIQUARY_WIKI_ASYNQ_CONCURRENCY=${RELIQUARY_WIKI_ASYNQ_CONCURRENCY:-8}
      - RELIQUARY_MODEL_MAX_CONCURRENCY=${RELIQUARY_MODEL_MAX_CONCURRENCY:-32}
      - APK_MIRROR_ARG=${APK_MIRROR_ARG:-}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - Reliquary-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Sandbox 镜像：仅用于 build/pull，非常驻。Docker 沙箱默认关闭，需
  # RELIQUARY_SANDBOX_DOCKER_ENABLED=true 并挂载 docker.sock 后，app 才会按会话创建容器。
  sandbox:
    image: reliquary-sandbox:${RELIQUARY_VERSION:-latest}
    pull_policy: build
    container_name: Reliquary-sandbox
    build:
      context: .
      dockerfile: docker/Dockerfile.sandbox
      target: sandbox
    profiles:
      - full
    command: ["true"]
    restart: "no"

  postgres:
    image: paradedb/paradedb:v0.22.2-pg17
    container_name: Reliquary-postgres
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - Reliquary-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s # 增加时间间隔
      timeout: 10s # 增加超时时间
      retries: 3 # 减少重试次数，让失败更快反馈
      start_period: 30s # 给予初始启动更多时间
    restart: unless-stopped
    # 添加停机时的优雅退出时间
    stop_grace_period: 1m

  redis:
    image: redis:7.0-alpine
    container_name: Reliquary-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    restart: always
    networks:
      - Reliquary-network

  # One-shot init: copy the read-only template settings.yml into a named volume
  # before searxng starts. Necessary because the searxng entrypoint sed-replaces
  # `ultrasecretkey` in /etc/searxng/settings.yml in place; bind-mounting the
  # repo file directly would write the resolved SEARXNG_SECRET back into the
  # working tree (and prevent re-templating on subsequent restarts).
  searxng-init:
    image: busybox:1.36
    container_name: Reliquary-searxng-init
    command: ["sh", "-c", "cp /template/settings.yml /etc/searxng/settings.yml && chmod 0644 /etc/searxng/settings.yml"]
    volumes:
      - ./docker/searxng/settings.yml:/template/settings.yml:ro
      - searxng_config:/etc/searxng
    restart: "no"
    networks:
      - Reliquary-network
    profiles:
      - searxng
      - full

  searxng:
    image: searxng/searxng:latest
    container_name: Reliquary-searxng
    # Bind to loopback by default; override SEARXNG_BIND=0.0.0.0 only after
    # rotating SEARXNG_SECRET and (optionally) re-enabling limiter in settings.yml.
    ports:
      - "${SEARXNG_BIND:-127.0.0.1}:${SEARXNG_PORT:-8888}:8080"
    volumes:
      - searxng_config:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:${SEARXNG_PORT:-8888}/
      - INSTANCE_NAME=reliquary-searxng
      # Default value lets `docker compose --profile searxng up` work zero-config.
      # Override via .env (e.g. `openssl rand -hex 32`) before exposing the
      # instance beyond the default 127.0.0.1 bind, since secret_key signs
      # image-proxy URLs and a shared default would be guessable by anyone.
      - SEARXNG_SECRET=${SEARXNG_SECRET:-reliquary-default-searxng-secret-rotate-before-exposing-publicly}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped
    depends_on:
      searxng-init:
        condition: service_completed_successfully
    networks:
      - Reliquary-network
    profiles:
      - searxng
      - full

networks:
  Reliquary-network:
    driver: bridge

volumes:
  postgres-data:
  data-files:
  searxng_config:
