services:
  frontend:
    image: reliquary-ui:${RELIQUARY_VERSION:-latest}
    pull_policy: build
    # Requires frontend/dist — run ./scripts/build_frontend_dist.sh before --build
    build:
      context: ./frontend
    container_name: Reliquary-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - MAX_SKILL_BUNDLE_SIZE_MB=${MAX_SKILL_BUNDLE_SIZE_MB:-256}
      - DEFAULT_LOCALE=${DEFAULT_LOCALE:-}
      - APP_HOST=${APP_HOST:-app}
      # APP_BACKEND_PORT: the port NGINX proxies to (default 8080).
      # For local deployment this is the App container's listening port, independent of host-mapped APP_PORT.
      # For remote deployment, set this to the remote App's service port.
      - APP_PORT=${APP_BACKEND_PORT:-8080}
      - APP_SCHEME=${APP_SCHEME:-http}
    # NOTE: If using a remote App backend, comment out or remove the depends_on
    # block below and set APP_HOST/APP_BACKEND_PORT/APP_SCHEME in your .env file.
    depends_on:
      app:
        condition: service_healthy
    networks:
      - Reliquary-network
    restart: unless-stopped

  app:
    image: reliquary-app:${RELIQUARY_VERSION:-latest}
    pull_policy: build
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        - APK_MIRROR_ARG=${APK_MIRROR_ARG:-}
        - WITH_ANYDOC=${WITH_ANYDOC:-1}
    container_name: Reliquary-app
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - data-files:/data/files
      - docreader-tmp:/tmp/docreader:ro
      - ./config/config.yaml:/app/config/config.yaml
      # Optional: mount custom skills directory (allows adding skills without rebuilding image)
      - ./skills/preloaded:/app/skills/preloaded
      # Docker 沙箱默认关闭（见 RELIQUARY_SANDBOX_DOCKER_ENABLED）。需要本机 daemon 时
      # 同时设 true 并挂载实际 socket——这等同宿主机 root，仅私有化单机。
      # 入口脚本会按 socket GID 把 appuser 加入对应组（compose group_add 在 gosu 后无效）。
      # - /var/run/docker.sock:/var/run/docker.sock
      # Optional: declarative built-in models. Copy config/builtin_models.yaml.example
      # to config/builtin_models.yaml, edit it for your deployment, then
      # uncomment the line below. See docs/BUILTIN_MODELS.md.
      # - ./config/builtin_models.yaml:/app/config/builtin_models.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Source .env so deployment-specific variables (e.g. those referenced by
    # config/builtin_models.yaml via ${ENV}, or any future feature) reach the
    # app container without having to be enumerated under `environment:`.
    #
    # NOTE: the array form below is used instead of the map form
    # (env_file: - path: .env, required: false) because the map syntax
    # requires Docker Compose v2.24+ (Jan 2024) and would break parsing on
    # older deploys. The trade-off is that Compose errors out if .env is
    # absent — see scripts/start_all.sh for the pre-flight touch that keeps
    # fresh clones working.
    env_file:
      - .env
    environment:
      # ========== 日志 ==========
      # 日志级别，默认debug
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      # 日志文件路径（留空则只输出 stdout）；LLM_DEBUG_LOG 开启时同目录写 llm_debug.log
      - LOG_PATH=${LOG_PATH:-}
      # 自定义日志格式模板（留空用内置默认格式）
      - LOG_FORMAT=${LOG_FORMAT:-}
      # LLM 调试日志：true 写 LOG_PATH 同目录 llm_debug.log，或指定路径；留空关闭
      - LLM_DEBUG_LOG=${LLM_DEBUG_LOG:-false}
      # ========== 运行时基础 ==========
      # gin mod
      # 可选值: debug(开发模式，有详细日志), release(生产模式，禁用Swagger文档)
      - GIN_MODE=${GIN_MODE:-release}
      # 时区，默认为Asia/Shanghai
      - TZ=${TZ:-Asia/Shanghai}
      # 文档处理语言（问题/摘要生成）。优先级：此环境变量（部署级覆盖，非空即生效）
      # > Accept-Language 请求头 > 内置默认值 (zh-CN)。留空则跟随请求方 Accept-Language。
      - RELIQUARY_LANGUAGE=${RELIQUARY_LANGUAGE:-}
      # Docker 沙箱默认关闭：本机 docker.sock 等同宿主机 root。
      # 系统管理员也可在「设置 → 系统设置」打开（立即生效）。未落库时读本变量。
      - RELIQUARY_SANDBOX_DOCKER_ENABLED=${RELIQUARY_SANDBOX_DOCKER_ENABLED:-false}
      # gin 信任的代理 CIDR（逗号分隔）；显式设为空字符串则禁用代理信任。
      # 默认信任 loopback + 私网段（容器网络内 nginx 已覆盖）
      # - RELIQUARY_TRUSTED_PROXIES=${RELIQUARY_TRUSTED_PROXIES:-}
      # 启动时自动执行数据库迁移；设为 false 禁用，默认启用
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
      # IM 渠道图片/文件外链的外部可达 URL。IM 显示知识库图片需二选一：
      # 存储后端公网可达（如 MINIO_ENDPOINT 设为公网），或设本变量走 <APP_EXTERNAL_URL>/r/<token>（需 nginx 代理 /r/）。
      # 默认 MinIO 内网部署 / local 后端需设本变量。
      # - APP_EXTERNAL_URL=${APP_EXTERNAL_URL:-}
      # 前端外部 origin，用于邀请链接等绝对 URL（留空走 host-relative）
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-}

      # 团队认证 / RBAC / 审计
      # 开启后密码必须包含大小写字母、数字和特殊字符，特殊字符包含：!@#$%^&*()_+-=[]{}|;:,.<>?
      - RELIQUARY_AUTH_COMPLEX_PASSWORD_ENABLED=${RELIQUARY_AUTH_COMPLEX_PASSWORD_ENABLED:-false}
      # 新建空间默认存储配额（GB，默认 10）
      - RELIQUARY_TENANT_DEFAULT_STORAGE_QUOTA_GB=${RELIQUARY_TENANT_DEFAULT_STORAGE_QUOTA_GB:-10}
      # 空间邀请链接 TTL（Go duration，默认 168h=7 天）
      - RELIQUARY_INVITATION_TTL=${RELIQUARY_INVITATION_TTL:-168h}
      # 审计日志保留天数（0 禁用清理，默认 90）
      - RELIQUARY_AUDIT_RETENTION_DAYS=${RELIQUARY_AUDIT_RETENTION_DAYS:-90}
      # 数据库设置
      - DB_DRIVER=${DB_DRIVER:-postgres}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_NAME=${DB_NAME:-}
      # 向量库 / 检索引擎
      # Docreader 解析调优
      - DOCREADER_ADDR=${DOCREADER_ADDR:-docreader:50051}
      - DOCREADER_TRANSPORT=${DOCREADER_TRANSPORT:-grpc}
      # docreader gRPC TLS / 认证（客户端侧）
      - GRPC_TLS_ENABLED=${GRPC_TLS_ENABLED:-false}
      - GRPC_TLS_CERT=${GRPC_TLS_CERT:-}
      - GRPC_TLS_KEY=${GRPC_TLS_KEY:-}
      - GRPC_TLS_CA=${GRPC_TLS_CA:-}
      - GRPC_TLS_SERVER_NAME=${GRPC_TLS_SERVER_NAME:-}
      - GRPC_AUTH_TOKEN=${GRPC_AUTH_TOKEN:-}
      # ========== 文件存储 ==========
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      # 允许用户使用的存储类型白名单（逗号分隔，留空允许全部）
      - STORAGE_ALLOW_LIST=${STORAGE_ALLOW_LIST:-}
      - LOCAL_STORAGE_BASE_DIR=${LOCAL_STORAGE_BASE_DIR:-/data/files}
      # 本地存储路径前缀（legacy 回填用，一般留空）
      - LOCAL_STORAGE_PATH_PREFIX=${LOCAL_STORAGE_PATH_PREFIX:-}
      - AUTO_RECOVER_DIRTY=${AUTO_RECOVER_DIRTY:-true}
      # ----- MinIO（STORAGE_TYPE=minio）-----
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY_ID=${MINIO_ACCESS_KEY_ID:-minioadmin}
      - MINIO_SECRET_ACCESS_KEY=${MINIO_SECRET_ACCESS_KEY:-minioadmin}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-}
      - MINIO_PATH_PREFIX=${MINIO_PATH_PREFIX:-}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      # ----- AWS S3（STORAGE_TYPE=s3）-----
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_PATH_PREFIX=${S3_PATH_PREFIX:-reliquary/}
      - S3_USE_SSL=${S3_USE_SSL:-true}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-false}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Ollama 不可用时仅告警不阻断（true 时生效）
      - OLLAMA_OPTIONAL=${OLLAMA_OPTIONAL:-true}
      # 批量 embedding 大小
      - BATCH_EMBED_SIZE=${BATCH_EMBED_SIZE:-}
      # VLM 单次 HTTP 请求超时（秒，默认 180）
      - VLM_HTTP_TIMEOUT_SECONDS=${VLM_HTTP_TIMEOUT_SECONDS:-}
      # LLM 流原始转储（排查上下文问题；1 启用，默认目录 ~/.reliquary/investigate/llm-stream）
      - RELIQUARY_LLM_STREAM_RAW_DUMP=${RELIQUARY_LLM_STREAM_RAW_DUMP:-}
      - RELIQUARY_LLM_STREAM_RAW_DUMP_DIR=${RELIQUARY_LLM_STREAM_RAW_DUMP_DIR:-}
      - STREAM_MANAGER_TYPE=${STREAM_MANAGER_TYPE:-}
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - REDIS_USERNAME=${REDIS_USERNAME:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-}
      - REDIS_PREFIX=${REDIS_PREFIX:-}
      # Redis TLS（托管 Redis 加密传输；REDIS_USE_TLS=true 时生效，详见 .env.example）
      - REDIS_TLS_SERVER_NAME=${REDIS_TLS_SERVER_NAME:-}
      - REDIS_TLS_INSECURE_SKIP_VERIFY=${REDIS_TLS_INSECURE_SKIP_VERIFY:-}
      # Redis 频道命名空间后缀（多部署共享同一 Redis 时隔离用）
      - RELIQUARY_REDIS_NAMESPACE=${RELIQUARY_REDIS_NAMESPACE:-}
      # Asynq 客户端 Redis 读写超时（毫秒，默认 500）
      - RELIQUARY_REDIS_OP_TIMEOUT_MS=${RELIQUARY_REDIS_OP_TIMEOUT_MS:-}
      # 数据库中 API Key 等敏感字段落盘加密的 AES-256 主密钥（必须为 32 字节）。
      # 加密范围：tenants.api_key、模型 API key、web search provider key。
      # 需重新填写）。生产环境必须显式设置且妥善保管，丢失则所有加密数据不可恢复。
      # （TENANT_AES_KEY / CRYPTO_MASTER_KEY / CRYPTO_SALT 已废弃：v0.4.0 起加密统一
      #   改用 SYSTEM_AES_KEY，Go 主应用不再读取这三个变量。）
      - SYSTEM_AES_KEY=${SYSTEM_AES_KEY:-}
      - SSRF_WHITELIST=${SSRF_WHITELIST:-}
      # 保留原始 URL 的图片域名白名单（逗号分隔，不替换为 provider://）
      - IMAGE_HOST_KEEP_URL=${IMAGE_HOST_KEEP_URL:-}
      # Always allow the optional searxng sidecar,
      # the default MinIO storage host (compose service names). User-controlled
      # endpoints are SSRF-validated and these private docker-network hosts
      # would otherwise be rejected; whitelisting them keeps the
      # out-of-box experience. Merged on top of SSRF_WHITELIST so user
      # overrides don't clobber it. (postgres is intentionally NOT listed: it
      # is not a user-registerable vector store, and whitelisting the app's own
      # DB host would skip the 5432 port block.)
      # credentials on whitelisted BE hosts.
      - CONCURRENCY_POOL_SIZE=${CONCURRENCY_POOL_SIZE:-5}
      - JWT_SECRET=${JWT_SECRET:-}
      # File size limit (in MB)
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      # Skill zip / GitHub source download cap (in MB); the GitHub zipball is the whole repo, not the skill subtree
      - MAX_SKILL_BUNDLE_SIZE_MB=${MAX_SKILL_BUNDLE_SIZE_MB:-256}
      # 文档处理任务总超时（Go duration，默认 2h）
      - RELIQUARY_DOCUMENT_PROCESS_TIMEOUT=${RELIQUARY_DOCUMENT_PROCESS_TIMEOUT:-}
      # 单次 DocReader RPC 超时（默认 30m，须小于上一项）
      - RELIQUARY_DOCREADER_CALL_TIMEOUT=${RELIQUARY_DOCREADER_CALL_TIMEOUT:-}
      # 知识库巡检回收（回收卡在 processing 的脏数据；false 禁用，不建议）
      - RELIQUARY_HOUSEKEEPING_ENABLED=${RELIQUARY_HOUSEKEEPING_ENABLED:-}
      # 自定义 Skills 目录（挂载后指定，免重建镜像）
      - RELIQUARY_SKILLS_DIR=${RELIQUARY_SKILLS_DIR:-}
      - RELIQUARY_CHAT_ATTACHMENT_TTL_HOURS=${RELIQUARY_CHAT_ATTACHMENT_TTL_HOURS:-24}
      - RELIQUARY_CHAT_ATTACHMENT_WAIT_TIMEOUT_SEC=${RELIQUARY_CHAT_ATTACHMENT_WAIT_TIMEOUT_SEC:-60}
      - RELIQUARY_CHAT_ATTACHMENT_OCR_CONCURRENCY=${RELIQUARY_CHAT_ATTACHMENT_OCR_CONCURRENCY:-8}
      - RELIQUARY_CHAT_ATTACHMENT_OCR_MAX_PAGES=${RELIQUARY_CHAT_ATTACHMENT_OCR_MAX_PAGES:-8}
      # Agent LLM call timeout
      - RELIQUARY_AGENT_LLM_TIMEOUT=${RELIQUARY_AGENT_LLM_TIMEOUT:-}
      - RELIQUARY_AGENT_TOOL_APPROVAL_TIMEOUT=${RELIQUARY_AGENT_TOOL_APPROVAL_TIMEOUT:-}
      # MCP 工具人工审批失败时是否放行（true 放行 / 默认 fail-close 拒绝）
      - RELIQUARY_AGENT_TOOL_APPROVAL_FAIL_OPEN=${RELIQUARY_AGENT_TOOL_APPROVAL_FAIL_OPEN:-}
      # Tenant / RBAC（详见 docs/RBAC说明.md 与 .env.example 注释）
      # - RELIQUARY_TENANT_ENABLE_RBAC: 是否启用空间角色强制鉴权（true / false），默认 true
      #   >0 强制限额；=0 走 handler 默认；<0 关闭限额（不建议共享部署使用）
      #   （兼容旧版默认下发 API Key 行为，破坏性变更回退开关；true / false，默认 false）
      - RELIQUARY_TENANT_ENABLE_RBAC=${RELIQUARY_TENANT_ENABLE_RBAC:-}
      - RELIQUARY_ASYNQ_CORE_CONCURRENCY=${RELIQUARY_ASYNQ_CORE_CONCURRENCY:-8}
      - RELIQUARY_ASYNQ_POSTPROCESS_CONCURRENCY=${RELIQUARY_ASYNQ_POSTPROCESS_CONCURRENCY:-2}
      - RELIQUARY_ASYNQ_ENRICHMENT_CONCURRENCY=${RELIQUARY_ASYNQ_ENRICHMENT_CONCURRENCY:-12}
      - RELIQUARY_ASYNQ_MAINTENANCE_CONCURRENCY=${RELIQUARY_ASYNQ_MAINTENANCE_CONCURRENCY:-4}
      - RELIQUARY_ASYNQ_SHARED_CONCURRENCY=${RELIQUARY_ASYNQ_SHARED_CONCURRENCY:-6}
      - RELIQUARY_WIKI_ASYNQ_CONCURRENCY=${RELIQUARY_WIKI_ASYNQ_CONCURRENCY:-8}
      - RELIQUARY_MODEL_MAX_CONCURRENCY=${RELIQUARY_MODEL_MAX_CONCURRENCY:-32}
      - APK_MIRROR_ARG=${APK_MIRROR_ARG:-}
      - RELIQUARY_BOOTSTRAP_SYSTEM_ADMIN_EMAIL=${RELIQUARY_BOOTSTRAP_SYSTEM_ADMIN_EMAIL:-}
      # 飞书云文档解析模式 export：导出为docx，blocks：根据飞书云文档块解析为markdown。默认为:export
      - FEISHU_DOCX_PARSE_MODE=${FEISHU_DOCX_PARSE_MODE:-export}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      docreader:
        condition: service_healthy
    networks:
      - Reliquary-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Sandbox 镜像：仅用于 build/pull，非常驻。Docker 沙箱默认关闭，需
  # RELIQUARY_SANDBOX_DOCKER_ENABLED=true 并挂载 docker.sock 后，app 才会按会话创建容器。
  sandbox:
    image: reliquary-sandbox:${RELIQUARY_VERSION:-latest}
    pull_policy: build
    container_name: Reliquary-sandbox
    build:
      context: .
      dockerfile: docker/Dockerfile.sandbox
      target: sandbox
    profiles:
      - full
    command: ["true"]
    restart: "no"

  docreader:
    image: reliquary-docreader:${RELIQUARY_VERSION:-latest}
    pull_policy: build
    build:
      context: .
      dockerfile: docker/Dockerfile.docreader
      args:
        - APT_MIRROR=${APT_MIRROR:-}
    container_name: Reliquary-docreader
    # docreader gRPC ships without auth/TLS and is only consumed by the app
    # container over the Reliquary-network (DOCREADER_ADDR defaults to
    # docreader:50051), so we don't publish 50051 to the host. `expose` keeps
    # the port reachable inside the compose network for documentation only.
    # If you need to call docreader from outside the host (e.g. for debugging),
    # add a `ports:` entry locally, preferably bound to 127.0.0.1.
    expose:
      - "50051"
    volumes:
      - docreader-tmp:/tmp/docreader
    environment:
      # ========== 基础 ==========
      - TZ=${TZ:-Asia/Shanghai}
      - LOG_LEVEL=${LOG_LEVEL:-}
      - DOCREADER_IMAGE_OUTPUT_DIR=/tmp/docreader
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-}
      # docreader 对外 HTTP 抓取的 SSRF 白名单（逗号分隔；与 app 共用同名变量）
      - SSRF_WHITELIST=${SSRF_WHITELIST:-}
      - SSRF_WHITELIST_EXTRA=${SSRF_WHITELIST_EXTRA:-searxng,minio}
      # ========== gRPC 服务端 TLS / 认证 ==========
      - GRPC_TLS_ENABLED=${GRPC_TLS_ENABLED:-false}
      - GRPC_TLS_CERT=${GRPC_TLS_CERT:-}
      - GRPC_TLS_KEY=${GRPC_TLS_KEY:-}
      - GRPC_TLS_CA=${GRPC_TLS_CA:-}
      - GRPC_TLS_SERVER_NAME=${GRPC_TLS_SERVER_NAME:-}
      # true 时强制要求客户端证书（mTLS）
      - GRPC_MTLS_REQUIRE_CLIENT_CERT=${GRPC_MTLS_REQUIRE_CLIENT_CERT:-false}
      - GRPC_AUTH_TOKEN=${GRPC_AUTH_TOKEN:-}
      # ========== gRPC 服务参数 ==========
      - DOCREADER_GRPC_MAX_WORKERS=${DOCREADER_GRPC_MAX_WORKERS:-4}
      - DOCREADER_GRPC_MAX_FILE_SIZE_MB=${DOCREADER_GRPC_MAX_FILE_SIZE_MB:-${MAX_FILE_SIZE_MB:-50}}
      - DOCREADER_GRPC_PORT=${DOCREADER_GRPC_PORT:-50051}
      # ========== 解析通用 ==========
      - DOCREADER_DOCX_MAX_PAGES=${DOCREADER_DOCX_MAX_PAGES:-0}
      - DOCREADER_MARKITDOWN_MAX_WORKERS=${DOCREADER_MARKITDOWN_MAX_WORKERS:-1}
      # 出站 HTTP/HTTPS 代理（抓取网页 / 远程图片时）
      - DOCREADER_EXTERNAL_HTTP_PROXY=${DOCREADER_EXTERNAL_HTTP_PROXY:-}
      - DOCREADER_EXTERNAL_HTTPS_PROXY=${DOCREADER_EXTERNAL_HTTPS_PROXY:-}
      # ========== OpenDataLoader hybrid ==========
      - DOCREADER_ODL_MAX_WORKERS=${DOCREADER_ODL_MAX_WORKERS:-1}
      - DOCREADER_ODL_HYBRID=${DOCREADER_ODL_HYBRID:-off}
      - DOCREADER_ODL_HYBRID_URL=${DOCREADER_ODL_HYBRID_URL:-http://odl-hybrid:5002}
      - DOCREADER_ODL_HYBRID_MODE=${DOCREADER_ODL_HYBRID_MODE:-auto}
      - DOCREADER_ODL_HYBRID_FALLBACK=${DOCREADER_ODL_HYBRID_FALLBACK:-false}
      - DOCREADER_ODL_MARKDOWN_WITH_HTML=${DOCREADER_ODL_MARKDOWN_WITH_HTML:-false}
      # ========== PDF 渲染 ==========
      - DOCREADER_PDF_RENDER_MAX_WORKERS=${DOCREADER_PDF_RENDER_MAX_WORKERS:-1}
      # 单个 PDF 内部扫描页渲染并行进程数（pdfium 非线程安全）。留空走代码默认 min(4,cpu)，
      # 避免在低核容器上过度并行（写死数值会覆盖 CPU 感知逻辑）。
      - DOCREADER_PDF_RENDER_PARALLELISM=${DOCREADER_PDF_RENDER_PARALLELISM:-}
      - DOCREADER_PDF_RENDER_DPI=${DOCREADER_PDF_RENDER_DPI:-200}
      # JPEG 质量（代码默认 85；compose 此前误写 90，已对齐）
      - DOCREADER_PDF_JPEG_QUALITY=${DOCREADER_PDF_JPEG_QUALITY:-85}
      # 渲染页图最大长边像素（防超大页撑爆 gRPC 消息上限；密集中文建议 >=1600）
      - DOCREADER_PDF_RENDER_MAX_EDGE=${DOCREADER_PDF_RENDER_MAX_EDGE:-2000}
      # 强制 PDF 全页按扫描件解析（文本层差但可 OCR 时；速度/成本上升）
      - DOCREADER_PDF_FORCE_SCANNED=${DOCREADER_PDF_FORCE_SCANNED:-false}
      # ========== PDF 版式 / 文本调优 ==========
      # glyph 间距超过 median 字宽的多少倍时插空格（默认 0.4）
      - DOCREADER_PDF_WORD_GAP_WIDTH_RATIO=${DOCREADER_PDF_WORD_GAP_WIDTH_RATIO:-0.4}
      # 丢弃窄边栏（arXiv 侧栏）的页宽比例阈值（默认 0.12）
      - DOCREADER_PDF_MARGIN_COL_WIDTH_RATIO=${DOCREADER_PDF_MARGIN_COL_WIDTH_RATIO:-0.12}
      - DOCREADER_PDF_MIN_HEADING_LINE_CHARS=${DOCREADER_PDF_MIN_HEADING_LINE_CHARS:-8}
      # 清理 U+FFFE/软连字符、剥离矢量图轴文字、图表区按 JPEG 渲染
      - DOCREADER_PDF_SANITIZE_TEXT=${DOCREADER_PDF_SANITIZE_TEXT:-true}
      - DOCREADER_PDF_STRIP_CHART_DEBRIS=${DOCREADER_PDF_STRIP_CHART_DEBRIS:-true}
      - DOCREADER_PDF_RENDER_VECTOR_FIGURES=${DOCREADER_PDF_RENDER_VECTOR_FIGURES:-true}
      - DOCREADER_PDF_DETECT_HEADINGS=${DOCREADER_PDF_DETECT_HEADINGS:-}
      - DOCREADER_PDF_LAYOUT_ORDERING=${DOCREADER_PDF_LAYOUT_ORDERING:-}
      - DOCREADER_PDF_FILTER_HIDDEN_TEXT=${DOCREADER_PDF_FILTER_HIDDEN_TEXT:-}
      # 扫描件判定：图片面积占比 >= 此值视为扫描页（默认留空走代码默认）
      - DOCREADER_PDF_SCAN_IMAGE_RATIO=${DOCREADER_PDF_SCAN_IMAGE_RATIO:-}
      - DOCREADER_PDF_SCAN_MIN_CHARS=${DOCREADER_PDF_SCAN_MIN_CHARS:-}
      # 嵌入图片抽取
      - DOCREADER_PDF_EXTRACT_EMBEDDED_IMAGES=${DOCREADER_PDF_EXTRACT_EMBEDDED_IMAGES:-}
      - DOCREADER_PDF_EMBED_MIN_PIXELS=${DOCREADER_PDF_EMBED_MIN_PIXELS:-}
      - DOCREADER_PDF_EMBED_MIN_AREA_RATIO=${DOCREADER_PDF_EMBED_MIN_AREA_RATIO:-}
      - DOCREADER_PDF_EMBED_REPEAT_PAGE_FRAC=${DOCREADER_PDF_EMBED_REPEAT_PAGE_FRAC:-}
      - DOCREADER_PDF_EMBED_MAX_IMAGES=${DOCREADER_PDF_EMBED_MAX_IMAGES:-}
      # 图表区识别
      - DOCREADER_PDF_MIN_CHART_REGION_AREA=${DOCREADER_PDF_MIN_CHART_REGION_AREA:-}
      - DOCREADER_PDF_MIN_CHART_REGION_CHARS=${DOCREADER_PDF_MIN_CHART_REGION_CHARS:-}
      - DOCREADER_PDF_MAX_CHART_REGION_AREA=${DOCREADER_PDF_MAX_CHART_REGION_AREA:-}
      - DOCREADER_PDF_MAX_FIGURE_HEIGHT_RATIO=${DOCREADER_PDF_MAX_FIGURE_HEIGHT_RATIO:-}
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - Reliquary-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # OpenDataLoader hybrid backend (optional). Default --no-ocr (no EasyOCR/libGL).
  # Local build only — not published to Docker Hub; use --profile odl-hybrid --build.
  odl-hybrid:
    build:
      context: .
      dockerfile: docker/Dockerfile.odl-hybrid
    image: reliquary-odl-hybrid:local
    container_name: Reliquary-odl-hybrid
    profiles:
      - odl-hybrid
    expose:
      - "5002"
    environment:
      - ODL_HYBRID_EXTRA_ARGS=${ODL_HYBRID_EXTRA_ARGS:---no-ocr}
    networks:
      - Reliquary-network
    restart: unless-stopped

  # 修改的PostgreSQL配置
  postgres:
    image: paradedb/paradedb:v0.22.2-pg17
    container_name: Reliquary-postgres
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - Reliquary-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s # 增加时间间隔
      timeout: 10s # 增加超时时间
      retries: 3 # 减少重试次数，让失败更快反馈
      start_period: 30s # 给予初始启动更多时间
    restart: unless-stopped
    # 添加停机时的优雅退出时间
    stop_grace_period: 1m

  redis:
    image: redis:7.0-alpine
    container_name: Reliquary-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    restart: always
    networks:
      - Reliquary-network

  # One-shot init: copy the read-only template settings.yml into a named volume
  # before searxng starts. Necessary because the searxng entrypoint sed-replaces
  # `ultrasecretkey` in /etc/searxng/settings.yml in place; bind-mounting the
  # repo file directly would write the resolved SEARXNG_SECRET back into the
  # working tree (and prevent re-templating on subsequent restarts).
  searxng-init:
    image: busybox:1.36
    container_name: Reliquary-searxng-init
    command: ["sh", "-c", "cp /template/settings.yml /etc/searxng/settings.yml && chmod 0644 /etc/searxng/settings.yml"]
    volumes:
      - ./docker/searxng/settings.yml:/template/settings.yml:ro
      - searxng_config:/etc/searxng
    restart: "no"
    networks:
      - Reliquary-network
    profiles:
      - searxng
      - full

  searxng:
    image: searxng/searxng:latest
    container_name: Reliquary-searxng
    # Bind to loopback by default; override SEARXNG_BIND=0.0.0.0 only after
    # rotating SEARXNG_SECRET and (optionally) re-enabling limiter in settings.yml.
    ports:
      - "${SEARXNG_BIND:-127.0.0.1}:${SEARXNG_PORT:-8888}:8080"
    volumes:
      - searxng_config:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:${SEARXNG_PORT:-8888}/
      - INSTANCE_NAME=reliquary-searxng
      # Default value lets `docker compose --profile searxng up` work zero-config.
      # Override via .env (e.g. `openssl rand -hex 32`) before exposing the
      # instance beyond the default 127.0.0.1 bind, since secret_key signs
      # image-proxy URLs and a shared default would be guessable by anyone.
      - SEARXNG_SECRET=${SEARXNG_SECRET:-reliquary-default-searxng-secret-rotate-before-exposing-publicly}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped
    depends_on:
      searxng-init:
        condition: service_completed_successfully
    networks:
      - Reliquary-network
    profiles:
      - searxng
      - full

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: Reliquary-minio
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY_ID:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_ACCESS_KEY:-minioadmin}
    command: server --console-address ":9001" /data
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - Reliquary-network
    profiles:
      - minio
      - full

  mcp:
    build:
      context: ./mcp-server
    container_name: Reliquary-mcp
    ports:
      - "${MCP_PORT:-8082}:8000"
    environment:
      - RELIQUARY_BASE_URL=http://app:8080/api/v1
      - RELIQUARY_API_KEY=${RELIQUARY_API_KEY:-}
      # HTTP/SSE 传输必填：mcp-server 启动时若缺少此项会拒绝启动（客户端以 Authorization: Bearer 携带）
      - MCP_SERVER_AUTH_TOKEN=${MCP_SERVER_AUTH_TOKEN:-}
      # 调用 Reliquary REST 的读超时（秒，默认 300）
      - RELIQUARY_CHAT_TIMEOUT=${RELIQUARY_CHAT_TIMEOUT:-300}
      # 是否校验 Reliquary 后端 TLS 证书（默认 true；自签证书可设 false）
      - RELIQUARY_VERIFY_SSL=${RELIQUARY_VERIFY_SSL:-true}
      # 允许上传的目录白名单（逗号分隔；留空禁用文件上传工具）
      - MCP_ALLOWED_UPLOAD_DIRS=${MCP_ALLOWED_UPLOAD_DIRS:-}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - Reliquary-network
    restart: unless-stopped
    profiles:
      - full

networks:
  Reliquary-network:
    driver: bridge

volumes:
  postgres-data:
  data-files:
  docreader-tmp:
  minio_data:
  searxng_config:
