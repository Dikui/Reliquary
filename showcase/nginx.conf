server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    add_header_inherit merge;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /api/v1/showcase/shelf {
        add_header Allow "GET" always;
        if ($request_method != GET) {
            return 405;
        }

        # Resolve via Docker DNS so replacing the app container refreshes its address.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $shelf_backend app:8080;
        proxy_pass http://$shelf_backend/api/v1/showcase/shelf$is_args$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/(api|mcp|files)(/|$) {
        return 404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
